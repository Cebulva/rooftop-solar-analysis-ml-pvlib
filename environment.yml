name: solar-env
channels:
  - conda-forge
  - defaults
  - pytorch   # added victoria for PyTorch / MPS

dependencies:
# === Conda Packages ===
  - python=3.12
  - pip

# --- CORE WEB APP ---
  - streamlit==1.52.0
  # - python-dotenv==1.2.1
  - Pillow==12.1.0

# --- DATA SCIENCE & PHYSICS ---
  - numpy==2.2.6
  # - numba==0.63.1
  - pvlib==0.13.1
  - pandas==2.3.3
  - matplotlib==3.10.8
  # - plotly==6.5.1
  # - scipy
  - scikit-learn            # uncommented victoria
  - ipywidgets              # added victoria

# --- MAPPING & GEOMETRY ---
  - geopandas
  - shapely==2.1.2
  - folium==0.20.0
  - mercantile
  - geopy
  - scikit-image==0.26.0
  - osmnx                   # added for building analysis (OpenStreetMap)
  # - pyproj

# --- MACHINE LEARNING & COMPUTER VISION ---
  - pytorch                # uncommented / added victoria
  - torchvision            # uncommented / added victoria
  - torchaudio             # uncommented / added victoria (for MPS)
  - tqdm                   # uncommented / added victoria
  # - tensorflow
  # - scikit-image==0.26.0
  # - rasterio

# --- AI & RAG CHATBOT ----
  # - llama-index
  # - llama-index-core
  # - sentence-transformers
  # - ragas
  # - python-dotenv
  # - pypdf==6.5.0

# --- GOOGLE MAPS INTEGRATION ---
  - googlemaps==4.10.0      # Official Python client for Google Maps services
  - requests==2.32.5        # Required for handling image downloads from Static API

# === Pip Packages ===
  - pip:
    - llama-index-llms-google-genai
    # - faiss-cpu==1.13.2
    - opencv-python-headless==4.12.0.88
    - streamlit-folium==0.25.3
    - segmentation-models-pytorch   # added victoria
    - pysolar                 # added for shadow/sun position analysis
                     